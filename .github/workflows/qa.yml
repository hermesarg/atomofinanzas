name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: python -m pip install -r requirements-lock.txt
      - name: Compile
        run: python -m compileall -q app.py app_cloud.py app_demo.py core screens tests
      - name: Periods
        run: python tests/check_periods.py
      - name: Public demo isolation
        run: python tests/check_demo.py
      - name: Electro and profile
        run: python tests/check_electro_profile.py
      - name: Accounting history
        run: python tests/check_history_accounting.py
      - name: Quick flows
        run: python tests/check_quick.py
      - name: Main flows
        run: python tests/check_flows.py
      - name: Migration and AI
        run: python tests/check_migration_and_ai.py
      - name: Private web
        run: python tests/check_web_private.py
